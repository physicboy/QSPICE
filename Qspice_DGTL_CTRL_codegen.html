    <script>
        const fileTemplates = {};
        let activeTab = 'main.cpp';

        function formatSciNotation(val) {
            return val.toExponential(3).toUpperCase().replace('+','');
        }

        function formatDllOutputPath(relPath, symbol) {
            let path = relPath.trim().replace(/\//g, '\\');
            if (!path || path === '.' || path === '.\\' || path === './') {
                return `${symbol}.dll`;
            }
            while (path.endsWith('\\')) {
                path = path.slice(0, -1);
            }
            
            // Escape backslashes for JSON compatibility
            const escapedPath = path.replace(/\\/g, '\\\\');
            return `${escapedPath}\\\\${symbol}.dll`;
        }

        function getCleanTargetDirPath(relPath) {
            let path = relPath.trim().replace(/\//g, '\\');
            if (!path || path === '.' || path === '.\\' || path === './') {
                return '';
            }
            while (path.endsWith('\\')) {
                path = path.slice(0, -1);
            }
            const escapedPath = path.replace(/\\/g, '\\\\');
            return `${escapedPath}\\\\`;
        }

        function generateCode() {
            const name = document.getElementById('moduleName').value.trim() || 'buck';
            const rawDllPath = document.getElementById('dllPath').value;
            const dgtlClkSec = (parseFloat(document.getElementById('dgtlClkNs').value) || 10) * 1e-9;
            const pwmCh = parseInt(document.getElementById('pwmCh').value) || 1;
            
            const tSwSec = parseFloat(document.getElementById('tSwSec').value) || 10e-6;
            const tSamplingSec = parseFloat(document.getElementById('tSamplingSec').value) || 5e-6;
            const dtNs = parseFloat(document.getElementById('deadtimeNs').value) || 0;
            const ioDefRaw = document.getElementById('ioDefText').value;

            const dgtlClkStr = formatSciNotation(dgtlClkSec);
            const tsamplingStr = formatSciNotation(tSamplingSec);
            
            const tbprd = Math.round(tSwSec / (2.0 * dgtlClkSec));
            const dtime = Math.round((dtNs * 1e-9) / dgtlClkSec);
            const formattedDllArg = formatDllOutputPath(rawDllPath, name);
            const targetDirPrefix = getCleanTargetDirPath(rawDllPath);

            let pwmEdgeUnwrapped = '';
            for (let i = 0; i < pwmCh; i++) {
                pwmEdgeUnwrapped += `   pwm_edge(&inst->pwm[${i}], &stepped);\n`;
            }

            // Construct exact-symbol delete command (e.g. buck.obj buck.def buck.map)
            let deleteCmdArgs = `del /Q ${name}.obj ${name}.def ${name}.map`;
            if (targetDirPrefix !== '') {
                deleteCmdArgs += ` ${targetDirPrefix}${name}.obj ${targetDirPrefix}${name}.def ${targetDirPrefix}${name}.map`;
            }
            deleteCmdArgs += ` 2>nul`;

            // 1. MAIN C++ FILE
            fileTemplates['main.cpp'] = `/*
 * Copyright 2026 Arief Noor Rahman - Power Control Design
 *
 * Project  : ${name}
 * Filename : ${name}.cpp
 *
 * Licensed under the Apache License, Version 2.0 (the "License");
 * you may not use this file except in compliance with the License.
 * You may obtain a copy of the License at
 *
 * http://www.apache.org/licenses/LICENSE-2.0
 */

// Automatically generated file for QSPICE Digital Control C-Block

#define TSAMPLING ${tsamplingStr}
#define PWM_CH    ${pwmCh}
#define TBPRD     ${tbprd}
#define DTIME     ${dtime}
#define DGTL_CLK  ${dgtlClkStr}

#include <malloc.h>
#include <math.h>
#include "udata.h"
#include "pwm_edge_handler.h"
#include "interrupt_handler.h"

int __stdcall DllMain(void *module, unsigned int reason, void *reserved) { return 1; }

struct sDGTL_CTRL_BLK
{
   double tsampling;

   int    counter;
   double maxstep;

   struct sPWM pwm[PWM_CH];

   struct sINTERRUPT data;
};

#define MAXSTEP(PWM)    if(t < inst->pwm[PWM].t_prd && inst->maxstep > (inst->pwm[PWM].t_prd - t))inst->maxstep = inst->pwm[PWM].t_prd - t;\\
                        if(t < inst->pwm[PWM].t_zero && inst->maxstep > (inst->pwm[PWM].t_zero - t))inst->maxstep = inst->pwm[PWM].t_zero - t;\\
                        if(t < inst->pwm[PWM].t_on && inst->maxstep > (inst->pwm[PWM].t_on - t))inst->maxstep = inst->pwm[PWM].t_on - t;\\
                        if(t < inst->pwm[PWM].t_off && inst->maxstep > (inst->pwm[PWM].t_off - t))inst->maxstep = inst->pwm[PWM].t_off - t;\\
                        if(t < inst->pwm[PWM].t_dly && inst->maxstep > (inst->pwm[PWM].t_dly - t))inst->maxstep = inst->pwm[PWM].t_dly - t;

extern "C" __declspec(dllexport) void ${name}(struct sDGTL_CTRL_BLK **opaque, double t, union uData *data)
{
   if(*ForKeeps == 0) return;

   #include "io_def.inc"

   if(!*opaque)
   {
      *opaque = (struct sDGTL_CTRL_BLK *) malloc(sizeof(struct sDGTL_CTRL_BLK));
      bzero(*opaque, sizeof(struct sDGTL_CTRL_BLK));

      (*opaque)->counter = -1;
      for(int i = 0; i < PWM_CH; i++) {
         (*opaque)->pwm[i].prd = TBPRD;
         (*opaque)->pwm[i].dt = DTIME;
      }
   }

   bool stepped = 0;
   struct sDGTL_CTRL_BLK *inst = *opaque;

   // Handle PWM state machine edge transitions (Unwrapped per channel for custom edge handler substitution)
${pwmEdgeUnwrapped}
   // Discrete Sampling & Interrupt Dispatch Logic
   if(*CKTtime - *CKTdelta <= inst->tsampling && *CKTtime >= inst->tsampling)
   {
      inst->tsampling += TSAMPLING;

      inst->counter += 1;
      if(inst->counter >= 4) inst->counter = 0;

      switch(inst->counter)
      {
         case 0:
            // Carrier Valley Interrupt
            interrupt0(&inst->data, inst->pwm, data);
            break;
         case 1:
            // Mid-Carrier Upslope (4x Oversampling)
            interrupt1(&inst->data, inst->pwm, data);
            break;
         case 2:
            // Carrier Peak Interrupt
            interrupt2(&inst->data, inst->pwm, data);
            break;
         case 3:
            // Mid-Carrier Downslope (4x Oversampling)
            interrupt3(&inst->data, inst->pwm, data);
            break;
      }
   }

   // Map PWM states and other outputs to available ports, example:
   // out1 = inst->pwm[0].outa;
   // out2 = inst->pwm[0].outb;

   // Adaptive Solver Timestep Control across all PWM channels
   if(stepped) inst->maxstep = DGTL_CLK;
   else
   {
      inst->maxstep = inst->tsampling - t;
      for(int i = 0; i < PWM_CH; i++) {
         MAXSTEP(i);
      }
      if(inst->maxstep <= DGTL_CLK / 2) inst->maxstep = DGTL_CLK;
   }
}

extern "C" __declspec(dllexport) double MaxExtStepSize(struct sDGTL_CTRL_BLK *inst, double t)
{
   return inst->maxstep;
}

extern "C" __declspec(dllexport) void Destroy(struct DGTL_CTRL_BLK *inst)
{
   free(inst);
}`;

            // 2. INTERRUPT HANDLER C FILE
            fileTemplates['interrupt_handler.c'] = `struct sINTERRUPT
{

};

#define PID(X,XPREV,KP,KITS, K)  K * (KP * ((X) - XPREV) + KITS * (X));  \
                              XPREV = X;
#define LPF(Y,X,TAU)          Y = (1. - TAU) * Y + TAU * (X); /*Compute TAU by w*Ts / (1 + w*Ts)  */

void interrupt0(struct sINTERRUPT *a, struct sPWM pwm[], union uData *data)

   // Control algorithm executed at carrier valley

}

{

   // Control algorithm executed at carrier peak
   
}

{

   // Mid-carrier down-slope (4x oversampling feedback measurement)

            // 3. INTERRUPT HANDLER HEADER
            fileTemplates['interrupt_handler.h'] = `#ifndef INTERRUPT_HANDLER_H

#include "udata.h"

            // 4. PWM EDGE HANDLER C FILE (Updated per request)
            fileTemplates['pwm_edge_handler.c'] = `struct sPWM
{
   int prd, dt;
   int cmpa, cmpb;
   double t_zero, t_prd;
   double t_on, t_off, t_dly;
   bool pwm, pwm_dly;
   bool outa, outb;
};

void pwm_edge(struct sPWM *a, bool *stepped)
{
   double tprev = *CKTtime - *CKTdelta;

   if(tprev <= a->t_on && *CKTtime >= a->t_on)
   {
      *stepped = 1;
      a->pwm = 1;
      a->t_dly = *CKTtime + a->dt * DGTL_CLK;
   }

   if(tprev <= a->t_off && *CKTtime >= a->t_off)
   {
      *stepped = 1;
      a->pwm = 0;
      a->t_dly = *CKTtime + a->dt * DGTL_CLK;
   }

   if(tprev <= a->t_dly && *CKTtime >= a->t_dly)
   {
      *stepped = 1;
      a->pwm_dly = a->pwm;
   }

   if(tprev <= a->t_prd && *CKTtime >= a->t_prd)
   {
      
   }

   if(tprev <= a->t_zero && *CKTtime >= a->t_zero)
   {
      a->t_prd  = *CKTtime + 1. * (double)a->prd * DGTL_CLK;
      a->t_zero = *CKTtime + 2. * (double)a->prd * DGTL_CLK;
      
      if(a->cmpa == a->prd) {
         a->t_on = *CKTtime + DGTL_CLK * (double)a->prd;
      } else if(a->cmpa == 0) {
         a->t_off = *CKTtime + 2. * (double)a->prd * DGTL_CLK;
      } else {
         a->t_on = *CKTtime + DGTL_CLK * (double)(2*a->prd - a->cmpa);
         a->t_off = *CKTtime + DGTL_CLK * (double)a->cmpa;
      }
   }

   a->outa = a->pwm && a->pwm_dly;
   a->outb = !a->pwm && !a->pwm_dly;
}`;

            renderTabs();

        function renderTabs() {
            const tabBar = document.getElementById('tabBar');
            const moduleName = document.getElementById('moduleName').value.trim() || 'buck';
            tabBar.innerHTML = '';
            
            const fileKeys = Object.keys(fileTemplates);

            fileKeys.forEach(key => {
                const displayLabel = (key === 'main.cpp') ? `${moduleName}.cpp` : key;
                
                const tab = document.createElement('div');
                tab.className = `tab ${key === activeTab ? 'active' : ''}`;
                tab.innerText = displayLabel;
                tab.onclick = () => {
                    activeTab = key;
                    renderTabs();
                    renderCode();
                };
                tabBar.appendChild(tab);
            });
        }

        function renderCode() {
            const codeViewer = document.getElementById('codeViewer');
            const langClass = activeTab.endsWith('.json') ? 'language-json' : 'language-cpp';
            
            codeViewer.className = langClass;
            codeViewer.textContent = fileTemplates[activeTab] || '';
            
            // Trigger Prism.js Syntax Highlighting
            if (window.Prism) {
                Prism.highlightElement(codeViewer);
            }
        }

        function copyCurrentCode() {
            const codeText = fileTemplates[activeTab];
            navigator.clipboard.writeText(codeText).then(() => {
                alert(`Copied code to clipboard!`);
            });
        }

        function downloadZipProject() {
            const moduleName = document.getElementById('moduleName').value.trim() || 'buck';
            const zip = new JSZip();

            // Create a dedicated root folder named after the module inside the zip
            const projectFolder = zip.folder(moduleName);

            // Add all files into the subfolder
            Object.keys(fileTemplates).forEach(key => {
                const fileName = (key === 'main.cpp') ? `${moduleName}.cpp` : key;
                if (key.startsWith('.vscode/')) {
                    // Maintain .vscode folder structure inside the project folder
                    projectFolder.folder(".vscode").file(key.replace('.vscode/', ''), fileTemplates[key]);
                } else {
                    projectFolder.file(fileName, fileTemplates[key]);
                }
            });

            zip.generateAsync({type: "blob"}).then(function(content) {
                const element = document.createElement('a');
                element.href = URL.createObjectURL(content);
                element.download = `${moduleName}_qspice_project.zip`;
                document.body.appendChild(element);
                element.click();
                document.body.removeChild(element);
            });
        }

        // Initial launch
        generateCode();
